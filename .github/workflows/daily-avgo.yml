name: AVGO Daily Notion 09:00 ICT
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  notion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run AVGO Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PARENT_ID: ${{ secrets.PARENT_ID }}
        run: python scripts/daily-avgo.py
